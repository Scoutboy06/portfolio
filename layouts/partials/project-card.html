<article class="project-card"><a class="project-visual {{ with .Params.cover }}cover-{{ . }}{{ end }}" href="{{ .RelPermalink }}" aria-label="Explore {{ .Title }}">{{ if .Params.featured_image }}<img src="{{ .Params.featured_image | relURL }}" alt="{{ .Title }} interface" loading="lazy">{{ else }}<div class="type-cover" aria-hidden="true"><strong>{{ .Params.cover_title | default .Title }}</strong><small>{{ delimit (first 2 .Params.tags) " / " }}</small></div>{{ end }}<span class="visual-arrow" aria-hidden="true">↗</span></a><div class="project-info"><p class="eyebrow">{{ .Params.category | default "PERSONAL PROJECT" }}</p><h3><a href="{{ .RelPermalink }}">{{ .Title }} <span aria-hidden="true">↗</span></a></h3><p>{{ .Description }}</p><div class="project-tags">{{ range first 4 .Params.tags }}<span class="tag">{{ . }}</span>{{ end }}</div></div></article>
